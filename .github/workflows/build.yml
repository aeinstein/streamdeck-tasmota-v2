name: Build plugin

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack
        run: npx streamdeck pack de.itnox.streamdeck.tasmota.sdPlugin --output release --force --no-update-check

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: de.itnox.streamdeck.tasmota
          path: release/*.streamDeckPlugin
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.streamDeckPlugin
          generate_release_notes: true
